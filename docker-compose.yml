# Olifant sur le NAS.
#
# Depuis Portainer : Stacks > Add stack > Repository
#   URL        https://github.com/davidp57/olifant
#   Compose    docker-compose.yml
# Portainer clone le depot et construit l'image lui-meme. Rien a pousser
# ailleurs, rien a telecharger a la main.
#
# Le service ne calcule rien et n'appelle aucun routeur : il sert ce que la
# commande `calcule` a produit et qui voyage dans le depot. Seul le fond de
# carte vient d'OpenStreetMap, cote navigateur.

services:
  olifant:
    build: .
    image: olifant:latest
    container_name: olifant
    restart: unless-stopped
    ports:
      # Changer le port de gauche si 8137 est deja pris sur le NAS.
      - "8137:8137"
    volumes:
      # Le carnet de sorties et les traces reellement suivies. Volume nomme
      # plutot qu'un dossier du NAS : Docker recopie alors les droits du
      # conteneur dedans, sans quoi le service (qui ne tourne pas en root)
      # ne pourrait pas y ecrire.
      - carnet:/data
    environment:
      TZ: Europe/Paris

volumes:
  carnet:
