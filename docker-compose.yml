# Olifant sur le NAS.
#
# Depuis Portainer : Stacks > Add stack > Web editor, coller ce fichier,
# Deploy the stack. Puis http://<nas>:8137
#
# L'image est construite par GitHub a chaque push et publiee sur ghcr.io, pour
# amd64 et arm64. L'editeur web de Portainer ne dispose que de ce fichier, pas
# du depot : il ne saurait donc pas construire l'image lui-meme.
#
# Le service ne calcule rien et n'appelle aucun routeur : il sert les traces
# deja calculees, qui voyagent dans l'image. Seul le fond de carte vient
# d'OpenStreetMap, cote navigateur.

services:
  olifant:
    image: ghcr.io/davidp57/olifant:latest
    # Pour construire localement plutot que de tirer l'image publique,
    # commenter la ligne ci-dessus et decommenter celle-ci :
    # build: .
    container_name: olifant
    restart: unless-stopped
    ports:
      # Changer le nombre de gauche si 8137 est deja pris sur le NAS.
      - "8137:8137"
    volumes:
      # Le carnet de sorties et les traces reellement suivies. Volume nomme
      # plutot qu'un dossier du NAS : le service ne tourne pas en root, et un
      # dossier monte arriverait en root:root, le laissant incapable d'ecrire.
      # Un volume nomme herite des droits poses par le Dockerfile.
      - carnet:/data
    environment:
      TZ: Europe/Paris

volumes:
  carnet:
