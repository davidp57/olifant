# Olifant - le fichier de reference.
#
# On n'ecrit ici que ce qu'un humain sait : des lieux nommes et l'ordre dans
# lequel on les enchaine. La trace, la distance, le denivele et la part de
# chemin sont calcules par `python -m olifant calcule`, jamais saisis.

meta:
  titre: Olifant
  accroche: >-
    Boucles de 10 a 15 km autour de Metz, et dix balades d'une heure au
    depart de la rue des Parmentiers. Celles qui partent a pied se retrouvent
    sur le parvis de la gare ; les autres demandent une demi-heure de voiture.
    Deux trajets en plus, qui vont aux commerces de Borny a pied.

points:

  # --- points de ralliement ---------------------------------------------
  gare:
    nom: Gare de Metz, parvis
    lon: 6.177013
    lat: 49.109277
    note: >-
      Point de ralliement des boucles a pied : a moins d'un quart d'heure de
      marche pour tout le monde. Abrite, cafe ouvert tot, toilettes.

  parmentiers:
    nom: Rue des Parmentiers, Metz
    lon: 6.176870
    lat: 49.115387
    note: >-
      Depart des deux boucles vers Borny, dans la Nouvelle Ville. A dix minutes
      a pied de la gare, dont il partage les commodites.

  # --- Metz et sa banlieue ----------------------------------------------
  parc-seille:
    nom: Parc de la Seille
    lon: 6.184968
    lat: 49.106610
    note: Prairies humides et roselieres au bord de la Seille. Herons.
  queuleu:
    nom: Fort de Queuleu
    lon: 6.195434
    lat: 49.098452
    note: >-
      Fort du XIXe siecle, memorial de la Resistance. Le bois autour est ouvert
      et sillonne de chemins.
  cheneau:
    nom: Parc de la Cheneau
    lon: 6.207915
    lat: 49.113291
    note: Grand parc boise a l'est de Metz, etang et allees en terre.
  borny-commerces:
    nom: Centre commercial de Borny
    lon: 6.227234
    lat: 49.105715
    note: >-
      L'ancien Cora, passe sous l'enseigne Carrefour ; galerie, cafe et
      toilettes. Le seul ravitaillement a mi-parcours des deux boucles de l'est.
  esplanade:
    nom: Jardin de l'Esplanade
    lon: 6.170519
    lat: 49.115968
    note: Terrasse au-dessus de la Moselle, vue sur le Mont Saint-Quentin.
  saulcy:
    nom: Ile du Saulcy
    lon: 6.161249
    lat: 49.120109
    note: Ile universitaire, tres calme hors semestre. Cygnes sur les deux bras.
  ban:
    nom: Le Ban-Saint-Martin
    lon: 6.151158
    lat: 49.122521
    note: On quitte la ville, la promenade suit la Moselle.
  longeville:
    nom: Longeville-les-Metz
    lon: 6.136124
    lat: 49.115245
    note: Rive droite, entre les jardins et le bras de la Moselle.
  moulins:
    nom: Moulins-les-Metz
    lon: 6.107503
    lat: 49.106851
    note: On traverse la Moselle ici pour rentrer par l'autre rive. Boulangerie.
  montigny:
    nom: Montigny-les-Metz
    lon: 6.163123
    lat: 49.087475
    note: Retour par le sud, jardins ouvriers et bord de Moselle.

  # --- cotes de Moselle --------------------------------------------------
  scy:
    nom: Eglise fortifiee Saint-Quentin, Scy-Chazelles
    lon: 6.111337
    lat: 49.111092
    note: >-
      Eglise fortifiee du XIIe siecle, tombe de Robert Schuman a l'interieur,
      sa maison a 200 m. C'est ici que commence la montee.
  quentin:
    nom: Mont Saint-Quentin, sommet
    lon: 6.127302
    lat: 49.121225
    note: >-
      358 m, ancien complexe fortifie en partie ruine, bois et prairies,
      panorama sur toute la vallee. Les batiments sont interdits d'acces.
  plappeville:
    nom: Plappeville
    lon: 6.125013
    lat: 49.131014
    note: Village vigneron du versant nord, ruelles et maisons de maitre.
  lorry:
    nom: Lorry-les-Metz
    lon: 6.120440
    lat: 49.143109
    note: Vergers et vignes en terrasse sur le versant nord de la cote.
  sainte-ruffine:
    nom: Sainte-Ruffine
    lon: 6.096321
    lat: 49.105775
    note: Petit village accroche a la cote, depart des sentiers du versant ouest.
  jussy:
    nom: Jussy
    lon: 6.086060
    lat: 49.101975
    note: Village vigneron, vue sur la vallee depuis les hauts.
  vaux:
    nom: Vaux
    lon: 6.080754
    lat: 49.094109
    note: Fond de vallon boise, source et lavoir.

  # --- vallee de la Mance et Gorze ---------------------------------------
  ars:
    nom: Ars-sur-Moselle
    lon: 6.076311
    lat: 49.076968
    note: Depart en voiture. Se garer pres de la gare ou du centre.
  jouy-aqueduc:
    nom: Aqueduc romain de Jouy-aux-Arches
    lon: 6.080250
    lat: 49.065293
    note: >-
      Sept arches encore debout d'un aqueduc du IIe siecle qui amenait l'eau
      de Gorze a Metz. La suite de l'ouvrage se devine tout le long du vallon.
  gorze:
    nom: Gorze
    lon: 5.998824
    lat: 49.051625
    note: >-
      Village au fond de la vallee, ancienne abbaye benedictine et palais
      abbatial. Boulangerie et cafe sur la place.
  abbaye-gorze:
    nom: Abbaye de Gorze
    lon: 5.997058
    lat: 49.055439
    note: Le palais abbatial et son jardin en terrasses.

  # --- vallee de la Canner -----------------------------------------------
  kedange:
    nom: Kedange-sur-Canner
    lon: 6.341200
    lat: 49.309500
    note: Depart en voiture, 35 min de Metz. Se garer pres de la mairie.
  hombourg:
    nom: Hombourg-Budange
    lon: 6.344634
    lat: 49.295953
    note: Chateau et parc, au bord de la Canner.
  foret-hombourg:
    nom: Foret de Hombourg-Budange
    lon: 6.371644
    lat: 49.285601
    note: Grande hetraie, chemins forestiers larges et bien traces.

  # --- pays des trois frontieres -----------------------------------------
  sierck:
    nom: Chateau des ducs de Lorraine, Sierck-les-Bains
    lon: 6.359738
    lat: 49.440098
    note: Depart en voiture, 45 min de Metz. Parking sous le chateau.
  montenach:
    nom: Montenach
    lon: 6.381197
    lat: 49.420355
    note: >-
      Village au pied de la reserve naturelle des pelouses calcaires, orchidees
      au printemps, vues sur la boucle de la Moselle.

  # --- reperes verts reperes autour de Metz -------------------------------
  grand-patural:
    nom: Le Grand Patural, Ban-Saint-Martin
    lon: 6.151052
    lat: 49.117929
    note: Prairie et promenade au bord de la Moselle, juste avant de quitter la ville.
  pas-du-loup:
    nom: Parc du Pas du Loup
    lon: 6.190089
    lat: 49.089365
    note: Coteau boise au sud du fort de Queuleu, sentiers en terre.
  bois-macabee:
    nom: Bois de la Macabee
    lon: 6.232106
    lat: 49.101397
    note: Le plus grand massif accessible a pied depuis Metz, hetres et charmes.
  gloucester:
    nom: Parc de Gloucester
    lon: 6.226121
    lat: 49.113226
    note: Allees en terre et pieces d'eau, a la lisiere est de Borny.
  schuman:
    nom: Parc Robert Schuman, Montigny
    lon: 6.140945
    lat: 49.099878
    note: Bras mort de la Moselle et grands arbres, entre Longeville et Montigny.
  sansonnet:
    nom: Parc du Sansonnet
    lon: 6.153597
    lat: 49.136765
    note: Etang et boisement au nord de Metz, sur le retour de la cote.
  port-metz:
    nom: Port de Metz
    lon: 6.190220
    lat: 49.139982
    note: Bassins et quais du port fluvial, ambiance industrielle au bord de l'eau.
  bois-grimont:
    nom: Bois de Grimont
    lon: 6.219099
    lat: 49.143424
    note: Bois de coteau au nord-est, vue sur la vallee de la Moselle.
  seille-marly:
    nom: Bord de Seille, Marly
    lon: 6.155748
    lat: 49.065114
    note: La Seille en amont de Metz, prairies inondables et ripisylve.
  parc-nec:
    nom: Parc du Nec, Marly
    lon: 6.163181
    lat: 49.061343
    note: Point le plus au sud de la boucle, avant de remonter la Seille.

  # --- points de passage pour caler les boucles en voiture ----------------
  # Releves sur OpenStreetMap (Overpass) : sommets, points de vue, villages
  # et cols qui servent a casser les aller-retours.

  # cotes de Jussy
  rozerieulles:
    nom: Rozerieulles
    lon: 6.082715
    lat: 49.107214
    note: Village vigneron sur le versant, en balcon au-dessus de la Moselle.
  lessy:
    nom: Lessy
    lon: 6.095582
    lat: 49.120168
    note: Village blotti dans le cirque, au pied du versant sud du Saint-Quentin.
  chatel-st-germain:
    nom: Chatel-Saint-Germain
    lon: 6.079120
    lat: 49.123716
    note: Vallon du ruisseau de Montvaux, ruines du chateau sur l'eperon.

  # vallee de Gorze
  source-bouillons:
    nom: Source des Bouillons, Gorze
    lon: 5.995189
    lat: 49.056690
    note: Resurgence qui alimentait l'aqueduc romain jusqu'a Metz.
  mont-st-blaise:
    nom: Mont Saint-Blaise
    lon: 6.004067
    lat: 49.055265
    note: Croupe boisee au-dessus de Gorze.
  croix-st-clement:
    nom: Croix Saint-Clement
    lon: 6.039177
    lat: 49.053780
    note: Carrefour de chemins sur le plateau, entre Gorze et la Moselle.
  roches-fraze:
    nom: Les Roches de la Fraze
    lon: 6.046575
    lat: 49.040158
    note: Corniche calcaire, vue plongeante sur la vallee de la Moselle.
  ancy:
    nom: Ancy-sur-Moselle
    lon: 6.058474
    lat: 49.056561
    note: Village au bord de l'eau, au debouche du vallon de Gorze.
  dornot:
    nom: Dornot
    lon: 6.056000
    lat: 49.048100
    note: Hameau viticole au pied de la corniche.

  # vallee de la Canner
  elzing:
    nom: Elzing
    lon: 6.328398
    lat: 49.319932
    note: Hameau au nord de la Canner.
  escherberg:
    nom: Escherberg
    lon: 6.317975
    lat: 49.315909
    note: Croupe boisee sur le versant nord de la vallee.
  metzeresche:
    nom: Metzeresche
    lon: 6.306848
    lat: 49.298641
    note: Village a l'ouest de la boucle, sur le plateau.
  sabelsberg:
    nom: Sabelsberg
    lon: 6.326878
    lat: 49.298212
    note: Bois du versant sud, entre Metzeresche et Hombourg.
  langenberg:
    nom: Langenberg
    lon: 6.352529
    lat: 49.318950
    note: Hauteur boisee a l'est de Kedange.

  # pays des trois frontieres
  stromberg:
    nom: Stromberg
    lon: 6.355809
    lat: 49.449933
    note: Sommet boise au nord de Sierck, le point haut du secteur.
  dreilaenderblick:
    nom: Vue des Trois Frontieres
    lon: 6.379732
    lat: 49.466350
    note: >-
      Belvedere sur la boucle de la Moselle et les trois pays, tout au nord de
      la boucle.
  rustroff:
    nom: Rustroff
    lon: 6.372046
    lat: 49.442158
    note: Village au-dessus de Sierck, entre vignes et pelouses seches.
  ferme-koenigsberg:
    nom: Ferme du Koenigsberg
    lon: 6.359513
    lat: 49.420557
    note: Ferme isolee sur le plateau, au-dessus de la reserve de Montenach.
  kerling:
    nom: Kerling-les-Sierck
    lon: 6.353243
    lat: 49.397766
    note: Village le plus au sud du secteur, sur le plateau agricole.
  hunting:
    nom: Hunting
    lon: 6.326126
    lat: 49.414041
    note: Village a l'ouest de la reserve, au bord du plateau.

  # --- le tour du vallon de Gorze ----------------------------------------
  # Releves autour du village : de quoi boucler par l'ouest et le sud plutot
  # que d'entrer et de ressortir par le meme chemin.
  saint-thiebaut:
    nom: Saint-Thiebaut
    lon: 5.990321
    lat: 49.058264
    note: Hameau accroche au versant nord du vallon, au-dessus de l'abbaye.
  croix-sergent:
    nom: Croix Sergent
    lon: 5.971396
    lat: 49.054633
    note: Croix de chemin sur le plateau, a l'ouest du vallon.
  labauville:
    nom: Labauville
    lon: 5.963820
    lat: 49.049105
    note: Ferme isolee au bout du plateau, point le plus a l'ouest de la boucle.
  mazagran:
    nom: Ferme de Mazagran
    lon: 5.998554
    lat: 49.033221
    note: Ferme isolee au sud, dans les champs qui dominent le vallon.
  vue-gorze:
    nom: Belvedere du vallon
    lon: 6.005246
    lat: 49.046635
    note: >-
      Point de vue sur Gorze et le fond du vallon, juste avant de redescendre
      au village.

  # --- autour de la rue des Parmentiers, pour les balades courtes --------
  # Ces points ne servent qu'aux dix boucles de 5 km : ils sont tous a moins
  # de deux kilometres du depart. Les coordonnees viennent d'OpenStreetMap,
  # pas d'une lecture de carte, et aucune etape n'est rattachee a plus de
  # 80 m d'un chemin.
  temple-neuf:
    nom: Temple Neuf et le Moyen Pont
    lon: 6.170382
    lat: 49.119743
    note: >-
      Pointe de l'ile du Petit-Saulcy, entre les deux bras de la Moselle ;
      la vue sur la cathedrale et le plan d'eau.
  esplanade-lac:
    nom: Parc du Lac aux Cygnes
    lon: 6.167327
    lat: 49.116160
    note: Rive du plan d'eau sous l'Esplanade, cygnes et saules.
  base-loisirs:
    nom: Base de loisirs de l'Esplanade
    lon: 6.163107
    lat: 49.115853
    note: Rive ouest du plan d'eau, face au Saulcy. Buvette l'ete.
  plan-eau-nord:
    nom: Plan d'eau, rive nord
    lon: 6.164400
    lat: 49.119200
    note: La rive d'en face, celle que personne ne prend. Plus calme, plus ombragee.
  port-marcel:
    nom: Port Saint-Marcel
    lon: 6.171312
    lat: 49.121635
    note: Petit port de plaisance au nord de l'ile, peniches a quai.
  saint-vincent:
    nom: Abbaye Saint-Vincent
    lon: 6.172450
    lat: 49.123134
    note: Ancienne abbaye du quartier Chambiere, facade classique.
  moulin-thermes:
    nom: Moulin des Thermes
    lon: 6.176562
    lat: 49.123052
    note: Bras de la Moselle a Chambiere, ancien moulin et lavoirs.
  sansonnet-sud:
    nom: Parc du Sansonnet, entree sud
    lon: 6.188000
    lat: 49.126000
    note: Le plus grand espace vert du nord de Metz, etang et sous-bois.
  sarrelouis:
    nom: Porte de Sarrelouis
    lon: 6.191447
    lat: 49.120629
    note: Vestige des fortifications du XVIIIe siecle, a l'est de la ville.
  porte-allemands:
    nom: Porte des Allemands
    lon: 6.185568
    lat: 49.117880
    note: >-
      Chatelet fortifie du XIIIe siecle a cheval sur la Seille, et le depart
      du chemin des remparts.
  tanneurs:
    nom: Jardin des Tanneurs
    lon: 6.181121
    lat: 49.119708
    note: Jardin en terrasses sur le flanc de la colline Sainte-Croix.
  cinq-sens:
    nom: Jardin des Cinq Sens
    lon: 6.180858
    lat: 49.112569
    note: Jardin au bord de la Seille, au pied d'Outre-Seille.
  saint-thiebault:
    nom: Place Saint-Thiebault
    lon: 6.177797
    lat: 49.112479
    note: Place plantee entre la Nouvelle Ville et la vieille ville.
  camoufle:
    nom: Tour Camoufle
    lon: 6.173578
    lat: 49.112047
    note: Tour d'artillerie du XVe siecle, restee seule dans son square.
  serpenoise:
    nom: Porte Serpenoise
    lon: 6.171024
    lat: 49.112570
    note: Porte de l'enceinte et entree du quartier imperial.
  jean-moulin:
    nom: Place Jean Moulin
    lon: 6.169686
    lat: 49.107869
    note: Entre la gare et le Sablon, sous les platanes.
  maud-huy:
    nom: Place de Maud'Huy
    lon: 6.167192
    lat: 49.108925
    note: Sud-ouest de la Nouvelle Ville, maisons allemandes.
  persuis:
    nom: Square Loiseau de Persuis, Sablon
    lon: 6.178319
    lat: 49.100723
    note: Coeur du Sablon, a mi-chemin entre la gare et les roselieres.
  keune:
    nom: Jardin Jean-Baptiste Keune
    lon: 6.180962
    lat: 49.108755
    note: Jardin du Sablon nord, a deux pas de la Seille.
  amphitheatre:
    nom: Parvis de l'Amphitheatre
    lon: 6.179658
    lat: 49.108685
    note: Le quartier neuf derriere la gare, Centre Pompidou et esplanade.
  pelt:
    nom: Jardins Jean-Marie Pelt
    lon: 6.185757
    lat: 49.106593
    note: Prolongement sud du parc de la Seille, prairies et passerelles.
  technopole:
    nom: Technopole, square Simon-Louis Freres
    lon: 6.202193
    lat: 49.111498
    note: Allees plantees du Technopole, autour du plan d'eau Symphonie.
  cheneau-est:
    nom: Parc de la Cheneau, entree ouest
    lon: 6.204000
    lat: 49.113000
    note: L'entree du parc du cote de Grigy, par les allees en terre.

parcours:

  # Les cinq boucles ci-dessous sont calees sur des mesures, pas sur des
  # estimations : distance reelle, denivele, part de chemin. Voir le README.

  - id: seille-borny
    nom: La Seille et les commerces de Borny
    acces: a pied
    themes: [eau, ville]
    couleur: 4A6B8C
    resume: >-
      Une course a pied plutot qu'une escapade : on descend la Seille et son
      parc, on traverse le Technopole jusqu'au centre commercial de Borny, et
      on rentre par le plus court. La seule boucle qui ne se referme pas sur
      la campagne.
    etapes: [parmentiers, parc-seille, borny-commerces, parmentiers]

  - id: borny-direct
    nom: Borny par le plus court
    acces: a pied
    themes: [ville]
    couleur: A0455B
    resume: >-
      Le meme but en trois quarts d'heure de moins : l'aller et le retour par
      le meme trace, celui que le routeur juge le plus court. Assume comme un
      aller-retour, pas comme une boucle.
    etapes: [parmentiers, borny-commerces, parmentiers]

  - id: seille-queuleu
    nom: La Seille et le fort de Queuleu
    acces: a pied
    themes: [eau, foret, patrimoine]
    couleur: 1E3B34
    resume: >-
      La plus courte, et deja presque moitie chemin : les roselieres de la
      Seille, le bois du fort de Queuleu, le coteau du Pas du Loup, retour par
      les jardins de Montigny.
    etapes: [gare, parc-seille, queuleu, pas-du-loup, montigny, gare]

  - id: bois-de-lest
    nom: Les bois de l'est
    acces: a pied
    themes: [foret, eau]
    couleur: 3E6B4F
    resume: >-
      La meme entree en matiere, puis on pousse jusqu'au bois de la Macabee,
      le plus grand massif qu'on puisse atteindre a pied depuis la gare, et on
      rentre par les parcs de Borny.
    etapes: [gare, parc-seille, queuleu, bois-macabee, gloucester, cheneau, gare]

  - id: deux-rives
    nom: Les deux rives
    acces: a pied
    themes: [eau, patrimoine]
    couleur: 316E7C
    resume: >-
      La Moselle dans les deux sens : on descend par l'Esplanade et l'ile du
      Saulcy, on remonte par les bras morts de Longeville et le parc Schuman.
    etapes: [gare, esplanade, saulcy, grand-patural, longeville, schuman, gare]

  - id: seille-amont
    nom: La Seille en amont
    acces: a pied
    themes: [eau]
    couleur: 5A6E2F
    resume: >-
      La plus verte du lot : plein sud le long de la Seille jusqu'aux prairies
      inondables de Marly, retour par les jardins de Montigny. Plate de bout
      en bout.
    etapes: [gare, parc-seille, seille-marly, montigny, gare]

  - id: cote-plappeville
    nom: Le versant de Plappeville
    acces: a pied
    themes: [relief, patrimoine]
    couleur: B8862A
    resume: >-
      La plus longue, et la seule qui monte vraiment : on gagne la cote par le
      Ban-Saint-Martin, on traverse le village vigneron de Plappeville et les
      vergers de Lorry, on redescend plein est.
    etapes: [gare, saulcy, grand-patural, plappeville, lorry, gare]

  # Les cinq boucles suivantes demandent une voiture pour rejoindre le depart.
  # Memes mesures, meme exigence : 10 a 15 km, moins d'un quart du trace
  # parcouru deux fois.

  - id: mont-saint-quentin
    nom: Le tour du Mont Saint-Quentin
    acces: voiture
    parking: Parking de l'eglise fortifiee, Scy-Chazelles (15 min de Metz)
    themes: [relief, foret, patrimoine]
    couleur: 8C4A2F
    resume: >-
      Le sommet et son fort en ruine, puis les deux villages vignerons du
      versant nord.
    etapes: [scy, quentin, plappeville, lorry, scy]

  - id: cotes-jussy
    nom: Les cotes de Jussy
    acces: voiture
    parking: Sainte-Ruffine, centre du village (15 min de Metz)
    themes: [relief, foret]
    couleur: 5A6E2F
    resume: >-
      Le versant ouest de la cote, vignes en bas et hetraie en haut, jusqu'au
      sommet du Saint-Quentin ; retour en balcon par Lessy et Rozerieulles.
    etapes: [sainte-ruffine, jussy, vaux, scy, quentin, lessy, rozerieulles,
             sainte-ruffine]

  - id: aqueduc-corniche
    nom: L'aqueduc et la corniche de la Fraze
    acces: voiture
    parking: Ars-sur-Moselle, pres de la gare (20 min de Metz)
    themes: [patrimoine, foret, relief]
    couleur: 7A4A6B
    resume: >-
      Les arches romaines de Jouy, puis la corniche calcaire qui surplombe la
      Moselle et le plateau boise ou passait l'aqueduc, retour par les villages
      viticoles.
    etapes: [ars, jouy-aqueduc, dornot, roches-fraze, croix-st-clement, ancy, ars]

  - id: canner
    nom: La vallee de la Canner
    acces: voiture
