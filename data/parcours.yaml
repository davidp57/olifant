  # --- dix balades courtes au depart de la rue des Parmentiers -----------
  #
  # Meme exigence que le reste, un seuil different. Le bitume d'abord : sur
  # une cinquantaine d'essais de 5 km au depart de la Nouvelle Ville, le
  # revetement dur ne descend jamais sous 24 % et tourne autour de 45 %.
  # Elles portent donc le theme « ville », qui leur applique un plafond de
  # 65 % au lieu de 45. La forme ensuite : on a refuse toute boucle qui part
  # toucher un lieu et revient par le meme chemin. Aucune des dix ne refait
  # plus de 250 m de son propre trace, et quatre n'en refont aucun.

  - id: moselle-deux-iles
    nom: La Moselle et les deux iles
    acces: a pied
    themes: [ville, eau]
    couleur: 4F7CAC
    resume: >-
      Le grand tour de l'eau : l'Esplanade, le lac aux Cygnes, la rive ouest
      du plan d'eau, la promenade du Grand Patural, et le retour par le
      Saulcy et le port Saint-Marcel. Pas un metre refait.
    etapes: [parmentiers, esplanade, esplanade-lac, base-loisirs, grand-patural,
             saulcy, port-marcel, temple-neuf, parmentiers]

  - id: chambiere-plan-eau
    nom: Chambiere et le plan d'eau
    acces: a pied
    themes: [ville, eau]
    couleur: 2E7A8C
    resume: >-
      La meme eau par l'autre bout : on longe la rive ouest du plan d'eau,
      on passe sur la rive nord -- celle que personne ne prend -- et on
      rentre par l'abbaye Saint-Vincent et l'ile.
    etapes: [parmentiers, esplanade, esplanade-lac, base-loisirs, plan-eau-nord,
             saint-vincent, temple-neuf, parmentiers]

  - id: sansonnet-portes
    nom: Le Sansonnet et les portes
    acces: a pied
    themes: [ville, foret, patrimoine]
    couleur: 6E8B3D
    resume: >-
      La plus verte des courtes cote nord : le bras de la Moselle a
      Chambiere, les sous-bois du parc du Sansonnet, puis les deux portes
      fortifiees, Sarrelouis et les Allemands. Un tiers de chemin balise.
    etapes: [parmentiers, moulin-thermes, sansonnet-sud, sarrelouis,
             porte-allemands, parmentiers]

  - id: remparts-sainte-croix
    nom: Les remparts et la colline Sainte-Croix
    acces: a pied
    themes: [ville, patrimoine]
    couleur: 8E5572
    resume: >-
      La plus courte : le chemin des remparts depuis la Porte des Allemands,
      les terrasses du jardin des Tanneurs, Chambiere et l'ile. Une heure,
      et tout le vieux Metz.
    etapes: [parmentiers, porte-allemands, tanneurs, moulin-thermes,
             saint-vincent, temple-neuf, esplanade, parmentiers]

  - id: jardins-du-centre
    nom: Le tour des jardins du centre
    acces: a pied
    themes: [ville, patrimoine]
    couleur: B5651D
    resume: >-
      Un chapelet de jardins et de places : les Cinq Sens au bord de la
      Seille, Saint-Thiebault, la tour Camoufle, la Porte Serpenoise,
      l'Esplanade, l'ile et les Tanneurs. Beaucoup de pave, peu de voitures.
    etapes: [parmentiers, cinq-sens, saint-thiebault, camoufle, serpenoise,
             esplanade, temple-neuf, tanneurs, parmentiers]

  - id: tour-du-sablon
    nom: Le tour du Sablon
    acces: a pied
    themes: [ville]
    couleur: 5D5FA6
    resume: >-
      Plein sud derriere la gare, la traversee du Sablon jusqu'a son square
      central, le retour par le jardin Keune et le quartier de
      l'Amphitheatre. Plate de bout en bout, et la moins bitumee du lot avec
      la Cheneau.
    etapes: [parmentiers, gare, jean-moulin, persuis, keune, amphitheatre,
             parmentiers]

  - id: seille-sablon
    nom: La Seille et le Sablon
    acces: a pied
    themes: [ville, eau]
    couleur: 7C6A3F
    resume: >-
      La descente vers le Sablon, puis la remontee par les jardins Pelt et
      le parc de la Seille : on rentre le long de l'eau, a plat et sur
      l'herbe.
    etapes: [parmentiers, gare, persuis, pelt, parc-seille, parmentiers]

  - id: boucle-de-la-seille
    nom: La boucle de la Seille
    acces: a pied
    themes: [ville, eau]
    couleur: 3F7D6E
    resume: >-
      Le tour complet de la riviere en ville : le jardin des Cinq Sens,
      l'Amphitheatre, les jardins Pelt, le parc de la Seille, et la remontee
      jusqu'a la Porte des Allemands. Quatre-vingts metres refaits, pas un de
      plus.
    etapes: [parmentiers, cinq-sens, amphitheatre, keune, pelt, parc-seille,
             porte-allemands, parmentiers]

  - id: technopole-cheneau
    nom: Le Technopole et la Cheneau
    acces: a pied
    themes: [ville, foret, eau]
    couleur: A34F6B
    resume: >-
      La plus longue des dix, et de loin la moins bitumee : le parc de la
      Seille, les allees du Technopole autour du plan d'eau Symphonie, et le
      parc de la Cheneau. On ne repasse nulle part.
    etapes: [parmentiers, cheneau-est, technopole, parc-seille, parmentiers]

  - id: nouvelle-ville-eau
    nom: La Nouvelle Ville et l'eau
    acces: a pied
    themes: [ville, patrimoine, eau]
    couleur: C2703D
    resume: >-
      La traversee des rues allemandes, de la gare a Maud'Huy, puis le
      basculement vers l'Esplanade, le lac aux Cygnes et le Saulcy. Beaucoup
      de trottoir a l'aller, l'eau tout le retour, et rien en double.
    etapes: [parmentiers, gare, jean-moulin, maud-huy, esplanade,
             esplanade-lac, saulcy, parmentiers]
